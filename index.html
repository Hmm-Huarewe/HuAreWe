  }
  .ch-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
  }
  .ch-on .ch-dot {
    background: #f8d089;
    border-color: #f8d089;
    box-shadow: 0 0 12px rgba(248,208,137,0.8);
  }

  /* Messages */
  .msg-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 8px 12px 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .msg-row {
    padding: 10px 12px;
    background: rgba(255,255,255,0.025);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 12px;
  }
  .msg-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .msg-from {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #f8d089;
  }
  .msg-time {
    font-size: 9px;
    color: #8a8270;
    letter-spacing: 0.1em;
  }
  .msg-body {
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    line-height: 1.4;
    color: #e8ddc4;
  }

  /* Inventory */
  .inv-grid {
    flex: 1;
    padding: 14px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    align-content: start;
  }
  .inv-slot {
    aspect-ratio: 1;
    background: rgba(255,255,255,0.02);
    border: 1px dashed rgba(255,255,255,0.08);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    color: rgba(255,255,255,0.18);
    font-size: 18px;
  }
  .inv-slot.has {
    background: linear-gradient(155deg, rgba(232,168,60,0.14) 0%, rgba(232,168,60,0.02) 100%);
    border: 1px solid rgba(232,168,60,0.45);
    box-shadow: 0 0 14px rgba(232,168,60,0.18) inset;
    color: #f8d089;
  }
  .inv-icon { font-size: 22px; }
  .inv-name {
    font-size: 8px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #c8bda4;
    text-align: center;
  }
  .inv-empty-note {
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 13px;
    color: #8a8270;
    padding: 4px 16px 18px 16px;
  }

  /* ═════════════════════════════════════════════════════════════════════
     FLASHLIGHT + CHANNEL OVERLAYS
     ═════════════════════════════════════════════════════════════════════ */
  .fl-overlay {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 240;
    mix-blend-mode: multiply;
  }
  .fl-beam {
    position: fixed;
    width: 420px; height: 420px;
    margin-left: -210px; margin-top: -210px;
    pointer-events: none;
    z-index: 241;
    background: radial-gradient(circle, rgba(255,230,170,0.28) 0%, rgba(255,210,130,0.14) 22%, rgba(255,185,90,0.04) 50%, rgba(0,0,0,0) 72%);
    mix-blend-mode: screen;
    border-radius: 50%;
  }
  .ch-wash {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 239;
    transition: opacity 0.6s ease, background 0.6s ease;
    mix-blend-mode: multiply;
  }

  /* Hidden symbols — barely visible normally, the flashlight beam reveals them */
  .hidden-sigil {
    position: absolute;
    pointer-events: none;
    z-index: 8;
    opacity: 0;
    color: #f8d089;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 18px;
    letter-spacing: 0.18em;
    transition: opacity 0.6s ease, text-shadow 0.6s ease;
    text-shadow: none;
  }
  .room.flashlight-on .hidden-sigil {
    opacity: 0.78;
    text-shadow: 0 0 10px rgba(248,208,137,0.6);
  }

  /* The key on the desk becomes a tap target */
  .key-spot { cursor: pointer; }
  .key-spot.collected {
    opacity: 0;
    transform: translateY(-12px) scale(0.85);
    transition: opacity 0.6s ease, transform 0.6s ease;
    pointer-events: none;
  }

  @media (max-width: 720px) {
    .obs-phone {
      width: 200px; height: 420px; bottom: -374px;
    }
    .obs-phone.raised {
      /* portrait — bottom-right, top aligned with fireplace top */
      right: 8px;
      left: auto;
      bottom: calc(54vh - 294px);
      transform-origin: bottom right;
    }
    .ph-greeting-l1 { font-size: 22px; }
    .ph-app-icon { width: 54px; height: 54px; }
  }

  /* ═══════════════════════════════════════════════════════════════════
     DIMENSION ROOM — forward (▲) from the final landing. Same cube as the
     front pad, but spacious and EMPTY; the back wall (where the fireplace
     used to be) holds three yin-yang doors. Inert for now.
     SIDE ROOM — a landing's ▶ placeholder, same shell.
     ═══════════════════════════════════════════════════════════════════ */
  .dimroom, .sideroom {
    position: fixed; inset: 0; z-index: 100;
    background: #0b0907; overflow: hidden;
    animation: bw-turn-in 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .dim-back, .side-back {
    position: absolute; top: 0; bottom: 23%; left: 14%; right: 14%;
    overflow: hidden; z-index: 4;
    background: linear-gradient(180deg,#1f1813 0%,#171009 52%,#100b06 100%);
    box-shadow: inset 0 0 120px rgba(0,0,0,0.68), inset 0 -8px 18px rgba(0,0,0,0.5);
  }
  .dim-back::before {            /* faint panelling so the emptiness still has texture */
    content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0.7;
    background: repeating-linear-gradient(90deg,
      rgba(255,255,255,0) 0px, rgba(255,255,255,0) 132px,
      rgba(255,210,150,0.035) 132px, rgba(255,210,150,0.035) 133px);
  }
  .dim-back::after {             /* soft overhead wash — keeps the room reading as airy */
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 64% 56% at 50% 38%, rgba(255,200,130,0.07) 0%, transparent 72%);
  }
  .dim-doors {
    position: absolute; left: 7%; right: 7%; top: 51%;
    transform: translateY(-50%);
    display: flex; align-items: center; justify-content: space-between; gap: 5%;
    z-index: 2;
  }
  .dim-door {
    position: relative; flex: 1 1 0; max-width: 26%;
    aspect-ratio: 1 / 2.15;
    border: none; border-radius: 5px 5px 2px 2px; padding: 0;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.3s ease, filter 0.3s ease;
  }
  .dim-door:hover  { transform: translateY(-4px); filter: brightness(1.08); }
  .dim-door:active { transform: translateY(-1px) scale(0.99); }
  .dd-single { width: 62%; aspect-ratio: 1; filter: drop-shadow(0 3px 8px rgba(0,0,0,0.4)); }
  .dd-stack  {
    display: flex; flex-direction: column; align-items: center; width: 52%;
    filter: drop-shadow(0 3px 8px rgba(0,0,0,0.4));
  }
  .dd-stack .dd-yy { width: 100%; aspect-ratio: 1; margin: -2% 0; }   /* tangent: the two circles touch */
  .dd-knob {
    position: absolute; bottom: 11%; right: 11%;
    width: 9px; height: 9px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(222,198,142,0.95), rgba(120,96,50,0.7));
    box-shadow: 0 0 6px rgba(0,0,0,0.6);
  }

  .side-back { display: flex; align-items: center; justify-content: center; }
  .side-note {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.3em; text-transform: uppercase;
    color: rgba(220,185,120,0.42);
  }

  /* ── HALL ROOM — a hall-landing's ▶ room: fireplace-room cube, video on the
       back (view) wall. You arrive at the THRESHOLD; ▲ steps you deeper in. ── */
  .hallroom {
    position: fixed; inset: 0; z-index: 100;
    background: #0b0907; overflow: hidden;
    perspective: 1500px;
    animation: hr-fade 0.4s ease both;
  }
  @keyframes hr-fade { from { opacity: 0; } to { opacity: 1; } }
  /* The whole cube is one "world" we push forward/back to fake walking steps. */
  .hr-world {
    position: absolute; inset: 0;
    transform-origin: 50% 58%;
    transition: transform 0.95s cubic-bezier(0.16, 1, 0.3, 1), filter 0.95s ease;
    will-change: transform;
  }
  .hr-world.hr-approach  { transform: scale(0.40) translateY(6%);  filter: brightness(0.36); }  /* far — just appeared */
  .hr-world.hr-threshold { transform: scale(0.84) translateY(1.5%); filter: brightness(0.84); }  /* at the doorway, room ahead */
  .hr-world.hr-inside    { transform: scale(1.16);                  filter: brightness(1.05); }  /* stepped in (▲) */
  .hr-back {
    position: absolute; top: 0; bottom: 23%; left: 14%; right: 14%;
    overflow: hidden; z-index: 4; background: #050403;
    box-shadow: inset 0 0 90px rgba(0,0,0,0.6), 0 0 0 2px rgba(20,15,9,0.9);
  }
  .hr-video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  .hr-wash {            /* settle the clip into the firelit room */
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 80% 70% at 50% 46%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.5) 100%),
      linear-gradient(180deg, rgba(20,12,4,0.16) 0%, rgba(20,12,4,0) 24%, rgba(8,5,2,0.28) 100%);
    box-shadow: inset 0 0 70px rgba(0,0,0,0.45);
  }
  @media (orientation: portrait) {
    .hr-back { left: 6%; right: 6%; bottom: 32%; }
  }

  /* ═══════════════════════════════════════════════════════════════════
     WAVE PORTAL — riddle overlay on the held skull-4 frame: ancient text
     rising from the book, two touch points (chandelier + skull), and the
     fire/spark burst when both are touched.
     The stage is a 16:9 box matching the object-fit:contain video, so the
     overlay anchors line up with the scene features.
     ═══════════════════════════════════════════════════════════════════ */
  .portal-scene {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: min(100vw, 177.78vh); height: min(56.25vw, 100vh);
    z-index: 140; pointer-events: none;
  }
  /* drifting smoke + light crystals + sparks — the living backdrop of the letters */
  .portal-aether {
    position: absolute; left: 52%; top: 62%; transform: translate(-50%, -50%);
    width: 62%; height: 30%; pointer-events: none;
    -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 42%, transparent 80%);
            mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 42%, transparent 80%);
  }
  /* ancient inscription rising out of the book — small, not wide */
  .portal-glyphs {
    position: absolute; left: 52%; top: 62%; transform: translate(-50%, -50%);
    display: flex; gap: 0.02em; white-space: nowrap;
    font-family: 'Cinzel', serif; font-weight: 600;
    font-size: clamp(12px, 1.5vw, 19px); letter-spacing: 0.04em;
    color: #ffe6a6;
  }
  .pg-char {
    display: inline-block;
    text-shadow: 0 0 8px rgba(255,196,92,0.9), 0 0 20px rgba(255,150,40,0.55), 0 1px 2px rgba(0,0,0,0.85);
    animation: pg-pop 1.1s cubic-bezier(0.18, 1.4, 0.4, 1) both;
  }
  @keyframes pg-pop {
    0%   { opacity: 0; transform: translateY(34px) scale(0.3); filter: blur(4px) brightness(2.4); }
    55%  { opacity: 1; transform: translateY(-5px) scale(1.16); filter: blur(0) brightness(1.7); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0) brightness(1); }
  }
  /* HIDDEN touch points — no ring; they must be found by guessing. */
  .portal-touch {
    position: absolute; transform: translate(-50%, -50%);
    width: 16%; height: 22%; border: none; background: none; padding: 0;
    pointer-events: auto; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .portal-touch:active { background: radial-gradient(circle, rgba(255,210,120,0.18), transparent 70%); }
  .pt-chandelier { left: 79%; top: 33%; }
  .pt-skull      { left: 25%; top: 68%; }
  .portal-burst {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none;
  }
  /* stepping forward into the hallway — the held clip pushes in */
  .lw-fsvideo.stepped-in video {
    transform: scale(1.22);
    transition: transform 1.1s cubic-bezier(0.16, 1, 0.3, 1);
  }
  /* the wandering orb */
  .portal-orb {
    position: absolute; transform: translate(-50%, -50%);
    width: clamp(58px, 7vw, 96px); height: clamp(58px, 7vw, 96px);
    border: none; background: none; padding: 0; pointer-events: auto;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: transform 0.45s ease, opacity 0.45s ease;
  }
  .portal-orb .orb-core {
    position: absolute; inset: 24%; border-radius: 50%;
    background: radial-gradient(circle at 36% 32%, #ffffff, #bfe6ff 38%, #6db4f0 64%, #2b6fd0 100%);
    box-shadow: 0 0 26px rgba(150,210,255,0.9), 0 0 60px rgba(110,180,255,0.6), inset 0 0 18px rgba(255,255,255,0.7);
    animation: orb-breathe 2.4s ease-in-out infinite;
  }
  .portal-orb .orb-glow {
    position: absolute; inset: -20%; border-radius: 50%;
    background: radial-gradient(circle, rgba(150,210,255,0.4), transparent 68%);
    animation: orb-breathe 2.4s ease-in-out infinite;
  }
  @keyframes orb-breathe { 0%,100% { transform: scale(0.92); } 50% { transform: scale(1.08); } }
  .portal-orb.popped { transform: translate(-50%,-50%) scale(2.1); opacity: 0; }
  /* the mirror */
  .portal-mirror {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    pointer-events: auto; cursor: pointer;
    animation: pm-rise 0.7s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes pm-rise { from { opacity: 0; transform: scale(0.86); } to { opacity: 1; transform: scale(1); } }
  .portal-mirror.stepping { animation: pm-enter 0.72s cubic-bezier(0.6,0,0.8,0.2) forwards; }
  @keyframes pm-enter { to { transform: scale(3.4); opacity: 0; } }
  .pm-frame {
    width: clamp(190px, 26vw, 360px); aspect-ratio: 3 / 4;
    border-radius: 50% 50% 48% 48% / 42% 42% 58% 58%;
    padding: clamp(8px, 1.1vw, 16px);
    background: linear-gradient(160deg, #caa54e 0%, #8a6c30 18%, #efd58a 38%, #6b5326 52%, #d9b96a 70%, #4a3a1c 100%);
    box-shadow: 0 0 40px rgba(255,210,120,0.4), 0 24px 60px rgba(0,0,0,0.7), inset 0 0 22px rgba(0,0,0,0.5);
  }
  .pm-inner {
    position: relative; width: 100%; height: 100%; overflow: hidden;
    border-radius: 50% 50% 48% 48% / 42% 42% 58% 58%;
    background: #05060a;
  }
  .pm-video {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    transform: scaleX(-1);   /* a real mirror */
  }
  .pm-silhouette {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 30% 24% at 50% 34%, rgba(40,52,74,0.9), transparent 70%),
      radial-gradient(ellipse 46% 50% at 50% 96%, rgba(34,44,64,0.9), transparent 72%),
      linear-gradient(180deg, #0a0e16, #05060a);
  }
  .pm-glass {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(125deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0) 30%, rgba(255,255,255,0) 70%, rgba(180,210,255,0.12) 100%);
    box-shadow: inset 0 0 40px rgba(0,0,0,0.55);
  }
  .pm-hint {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.34em; text-transform: uppercase;
    color: rgba(248,224,160,0.85); text-shadow: 0 0 12px rgba(0,0,0,0.9);
    animation: pm-hint-pulse 2s ease-in-out infinite;
  }
  @keyframes pm-hint-pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
</style>
</head>
<body>
<div id="root"></div>

<script>
  /* Defaults rewritten in place by the Tweaks panel. */
  window.PAD_DEFAULTS = /*EDITMODE-BEGIN*/{

  }/*EDITMODE-END*/;

  /* Cadence lines — the Articulate's slow narration. Loops.
     Updated for standing-observer view (no couch references). */
  window.CADENCE = [
    "You did not arrive. You returned.",
    "The room you are in has been waiting.",

    "Notice the air in your chest.",
    "To your right, a desk.",
    "On the desk, a lantern.",
    "On the desk, a key.",
    "The lantern is for the road outside.",
    "The key is for a door not yet shown.",
    "To your left, a screen.",
    "On the screen, the parable.",
    "On the screen, the road moves.",
    "On the screen, the smoke drifts.",
    "On the screen, you are walking.",
    "Even standing here, you are walking.",
    "The flame was never out.",
    "Only the glass needed cleaning.",
    "Across the room, someone plays.",
    "You do not have to follow.",
    "You may only listen.",
    "What you put out is what you get back.",
    "What you put out is what you get back —",
    "as resonance.",
    "I am here.",
    "I am the Articulate.",

  ];

  /* Floor caption — switches occasionally. */
  window.ROOM_CAPTIONS = [

    "outside this room — the mansion"
  ];
</script>
</body>
